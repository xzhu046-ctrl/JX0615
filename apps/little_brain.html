<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>小脑瓜</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Nunito:wght@700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root{
      --black:#0a0a0a;
      --ink:#111;
      --muted:#6d6d6d;
      --faint:#9a9a9a;
      --line:rgba(17,17,17,.16);
      --line-strong:#111;
      --paper:rgba(255,255,255,.82);
      --soft:rgba(247,247,247,.76);
      --bg:#f7f7f7;
      --shadow:0 18px 48px rgba(0,0,0,.10);
      --bd:2px solid #111;
      --sh:5px 5px 0 rgba(17,17,17,.16);
      --font:'Quicksand',-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
      --fontd:'Nunito','Quicksand',sans-serif;
      --fontcute:'ZCOOL KuaiLe','Nunito',sans-serif;
    }
    *{ box-sizing:border-box; }
    [hidden]{ display:none!important; }
    html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); }
    body{ overflow:hidden; }
    button,input,textarea{ font:inherit; }
    button{ -webkit-tap-highlight-color:transparent; -webkit-appearance:none; appearance:none; }
    .app{
      position:relative;
      height:100vh;
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:#f7f7f7;
    }
    .app::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(180deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.74) 35%,rgba(247,247,247,.98) 78%),
        url('assets/%E6%A8%B1%E8%8A%B1%E5%9C%A8%E6%B0%B4%E9%87%8C.jpg');
      background-position:center top;
      background-repeat:no-repeat;
      background-size:cover;
      pointer-events:none;
      z-index:0;
    }
    .app::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:46%;
      background:linear-gradient(180deg,rgba(247,247,247,0),#f7f7f7 42%,#f7f7f7 100%);
      pointer-events:none;
      z-index:0;
    }
    .topbar,.content{ position:relative; z-index:1; }
    .topbar{
      position:absolute;
      z-index:40;
      left:18px;
      right:18px;
      top:max(calc(env(safe-area-inset-top,0px) + 12px),18px);
      height:44px;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      border-bottom:0;
      background:transparent;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      pointer-events:none;
    }
    .topbar::after{ display:none; }
    .icon-btn{
      width:38px;
      height:38px;
      border:2px solid #111;
      background:rgba(255,255,255,.90);
      color:var(--black);
      display:grid;
      place-items:center;
      border-radius:12px;
      box-shadow:2px 2px 0 rgba(17,17,17,.18);
      pointer-events:auto;
    }
    .icon-btn svg{ width:21px; height:21px; display:block; }
    .icon-btn img{ width:19px; height:19px; object-fit:contain; display:block; }
    .icon-btn:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(17,17,17,.24); background:#fff; }
    .topbar-spacer{ flex:1 1 auto; min-width:0; }
    #subtitle{ display:none; }
    .content{ flex:1 1 auto; min-height:0; overflow:auto; padding:calc(env(safe-area-inset-top,0px) + 66px) 12px calc(env(safe-area-inset-bottom,0px) + 20px); -webkit-overflow-scrolling:touch; }
    body.picker-view .content{ padding-top:8px; }
    .char-strip{ display:flex; gap:14px; overflow-x:auto; padding:4px 2px 18px; scrollbar-width:none; }
    .char-strip::-webkit-scrollbar{ display:none; }
    .char-chip{ flex:0 0 auto; width:70px; border:0; background:transparent; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:7px; padding:4px 2px; }
    .char-chip .avatar{ width:58px; height:58px; border-radius:999px; overflow:hidden; background:#fff; border:2px solid #111; display:grid; place-items:center; box-shadow:0 0 0 4px #fff,0 12px 24px rgba(0,0,0,.12); color:var(--black); font-family:var(--fontd); font-weight:900; }
    .char-chip.active .avatar{ background:#111; color:#fff; outline:2px solid #111; outline-offset:4px; }
    .char-chip img{ width:100%; height:100%; object-fit:cover; display:block; }
    .char-chip span:last-child{ width:100%; text-align:center; font-size:11px; font-weight:900; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .panel{
      background:var(--paper);
      border:2px solid rgba(17,17,17,.88);
      border-radius:20px;
      padding:14px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
      backdrop-filter:blur(12px) saturate(126%);
      -webkit-backdrop-filter:blur(12px) saturate(126%);
    }
    .hero{ display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center; padding:15px; }
    .hero-avatar{ width:76px; height:76px; border-radius:20px; overflow:hidden; background:#fff; display:grid; place-items:center; color:var(--black); font-family:var(--fontd); font-weight:900; border:2px solid var(--black); box-shadow:4px 4px 0 rgba(17,17,17,.18); transform:rotate(-2deg); }
    .hero-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
    .hero-main{ min-width:0; }
    .hero-name{ display:flex; align-items:center; gap:8px; font-family:var(--fontcute); font-size:22px; color:var(--black); font-weight:900; }
    .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--black); box-shadow:0 0 0 4px rgba(0,0,0,.08); }
    .hero-sub{ margin-top:6px; font-size:12px; color:#555; line-height:1.55; font-weight:700; }
    .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
    .stat{ background:rgba(255,255,255,.68); border:1.5px solid rgba(17,17,17,.18); border-radius:14px; padding:8px 3px; min-width:0; text-align:center; box-shadow:inset 0 0 0 1px rgba(255,255,255,.7); }
    .stat b{ display:block; font-family:var(--fontd); font-size:17px; color:var(--black); line-height:1.1; font-weight:900; }
    .stat span{ display:block; margin-top:3px; font-size:10px; font-weight:900; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
    .action{ border:2px solid var(--black); border-radius:999px; min-height:38px; padding:0 10px; color:#fff; background:var(--black); font-family:var(--fontd); font-size:12px; font-weight:900; letter-spacing:.02em; white-space:nowrap; box-shadow:2px 2px 0 rgba(17,17,17,.20); }
    .action.secondary{ color:var(--black); background:rgba(255,255,255,.92); border:2px solid #111; }
    .action:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(17,17,17,.22); }
    .section-title{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 11px; }
    .section-title h2{ margin:0; font-family:var(--fontcute); font-size:18px; color:var(--black); font-weight:900; }
    .section-title span{ font-size:10px; font-family:var(--fontd); font-weight:900; color:var(--muted); letter-spacing:.10em; text-transform:uppercase; }
    .memory-grid{ display:grid; grid-template-columns:1fr; gap:8px; }
    .memory-filter-strip{ display:flex; gap:8px; overflow-x:auto; padding:0 1px 12px; margin:-2px 0 2px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .memory-filter-strip::-webkit-scrollbar{ display:none; }
    .memory-filter-btn{ flex:0 0 auto; min-height:32px; border:2px solid #111; border-radius:999px; padding:0 13px; background:rgba(255,255,255,.88); color:#111; font-family:var(--fontcute); font-size:13px; font-weight:900; box-shadow:2px 2px 0 rgba(17,17,17,.14); white-space:nowrap; }
    .memory-filter-btn.active{ background:#111; color:#fff; box-shadow:2px 2px 0 rgba(17,17,17,.26); }
    .memory-filter-btn:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(17,17,17,.22); }
    .mem-row{ border:0; border-radius:0 18px 18px 0; background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(239,239,239,.38)),linear-gradient(180deg,rgba(17,17,17,.14) 0%,rgba(17,17,17,.88) 24%,rgba(17,17,17,.88) 76%,rgba(17,17,17,.14) 100%); background-repeat:no-repeat; background-size:100% 100%,3px 100%; padding:11px 12px 11px 17px; box-shadow:0 10px 24px rgba(0,0,0,.06); }
    .mem-row strong{ display:flex; justify-content:space-between; gap:8px; font-size:11px; font-family:var(--fontd); color:var(--black); font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .mem-row p{ margin:7px 0 0; font-size:13px; line-height:1.62; color:#2c2c2c; white-space:pre-wrap; font-weight:650; }
    .empty{ color:#555; font-size:13px; font-weight:800; line-height:1.7; padding:13px 4px; text-align:center; text-decoration-line:underline; text-decoration-style:dashed; text-decoration-thickness:2px; text-underline-offset:5px; }
    .settings{ display:grid; gap:10px; }
    .field{ display:grid; gap:6px; }
    .field label{ font-size:10px; font-family:var(--fontd); font-weight:900; letter-spacing:.13em; color:#727272; text-transform:uppercase; }
    .field input{ width:100%; border:0; border-bottom:1.5px dashed rgba(17,17,17,.32); border-radius:0; padding:10px 2px 9px; background:rgba(255,255,255,.18); color:var(--ink); outline:none; font-size:13px; font-weight:800; -webkit-text-fill-color:currentColor; }
    .field input:focus{ border-color:var(--black); box-shadow:0 6px 0 -5px #111; background:rgba(255,255,255,.42); }
    .switch-line{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px dashed rgba(17,17,17,.18); }
    .switch-line:last-child{ border-bottom:0; }
    .switch-line span{ font-size:13px; color:var(--ink); font-weight:850; }
    .switch{ width:48px; height:28px; border:2px solid #111; border-radius:999px; background:#fff; padding:2px; transition:.18s ease; box-shadow:2px 2px 0 rgba(17,17,17,.16); }
    .switch::before{ content:""; display:block; width:20px; height:20px; border-radius:50%; background:#111; box-shadow:0 2px 6px rgba(0,0,0,.16); transition:.18s ease; }
    .switch.on{ background:var(--black); }
    .switch.on::before{ transform:translateX(20px); background:#fff; }
    .toast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 64px); z-index:900; transform:translateX(-50%) translateY(-12px); opacity:0; pointer-events:none; background:rgba(5,5,5,.94); color:#fff; padding:10px 14px; border-radius:999px; font-size:13px; font-weight:800; transition:.2s ease; max-width:86vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-shadow:0 12px 30px rgba(0,0,0,.22); }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    .picker-panel{ display:block; padding:0; overflow:hidden; border:2px solid #111; border-radius:0 24px 24px 0; background:rgba(255,255,255,.64); box-shadow:8px 8px 0 rgba(17,17,17,.13),0 22px 48px rgba(0,0,0,.10); }
    .picker-hero{
      position:relative;
      min-height:214px;
      padding:calc(env(safe-area-inset-top,0px) + 62px) 54px 52px;
      text-align:center;
      border-bottom:0;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background-image:
        linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.78) 72%,rgba(255,255,255,.94)),
        url('assets/%E6%A8%B1%E8%8A%B1%E5%9C%A8%E6%B0%B4%E9%87%8C.jpg');
      background-position:center 22%;
      background-repeat:no-repeat;
      background-size:cover;
    }
    .picker-hero::before{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      bottom:48px;
      border-bottom:2px dashed rgba(17,17,17,.38);
    }
    .picker-kicker{ display:none; }
    .picker-title{
      position:relative;
      z-index:2;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:0;
      color:#050505;
      font-family:var(--fontcute);
      font-size:clamp(30px,9vw,48px);
      font-weight:900;
      line-height:1;
      letter-spacing:0;
      white-space:nowrap;
      text-shadow:0 2px 0 rgba(255,255,255,.62);
    }
    .picker-title .latin{ font-family:var(--fontcute); font-weight:900; letter-spacing:0; }
    .picker-copy{ display:none; }
    .config-alert{ position:relative; z-index:2; width:calc(100% - 28px); display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px 15px 15px 18px; border:0; border-radius:0 18px 18px 0; background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(240,240,240,.46)),linear-gradient(180deg,rgba(17,17,17,.14) 0%,rgba(17,17,17,.86) 24%,rgba(17,17,17,.86) 76%,rgba(17,17,17,.14) 100%); background-repeat:no-repeat; background-size:100% 100%,3px 100%; margin:-48px 14px 16px; box-shadow:0 14px 30px rgba(0,0,0,.11); }
    .config-alert strong{ display:block; font-family:var(--fontcute); font-size:16px; color:var(--black); }
    .config-alert span{ display:block; margin-top:3px; font-size:11px; font-weight:750; color:#555; line-height:1.5; }
    .char-card-list{ display:grid; gap:14px; padding:0 14px 16px; }
    .char-card{ border:2px solid #111; border-radius:0; background:#fff; padding:10px; box-shadow:6px 6px 0 rgba(0,0,0,.82); color:#111; }
    .char-card:nth-child(2n){ transform:rotate(.8deg); }
    .char-card:nth-child(2n+1){ transform:rotate(-.65deg); }
    .char-card:active{ transform:translate(1px,1px) rotate(0deg); box-shadow:3px 3px 0 rgba(0,0,0,.82); }
    .char-card-top{ display:grid; grid-template-columns:72px minmax(0,1fr) 38px; align-items:center; gap:12px; cursor:pointer; }
    .char-card-avatar{ width:72px; height:72px; min-height:72px; overflow:hidden; border:2px solid #111; background:#111; padding:0; display:grid; place-items:center; color:#fff; font-family:var(--fontd); font-weight:900; flex:0 0 auto; box-shadow:2px 2px 0 #111; }
    .char-card-avatar img{ width:100%; height:100%; object-fit:cover; display:block; border:0; background:#eee; }
    .char-card-main{ min-width:0; flex:1; }
    .char-card-name{ font-family:var(--fontcute); font-size:20px; font-weight:900; color:#050505; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .char-card-status{ margin-top:5px; display:inline-flex; align-items:center; gap:6px; font-size:10px; font-family:var(--fontd); font-weight:900; letter-spacing:.12em; text-transform:uppercase; color:#6d6d6d; }
    .char-card-status::before{ content:""; width:7px; height:7px; border-radius:999px; background:#bdbdbd; }
    .char-card.is-ready .char-card-status{ color:#111; }
    .char-card.is-ready .char-card-status::before{ background:#111; }
    .enter-btn{ width:36px; height:36px; border-radius:999px; border:2px solid #111; background:#111; color:#fff; display:grid; place-items:center; flex:0 0 auto; box-shadow:2px 2px 0 rgba(17,17,17,.20); }
    .char-card-controls{ margin-top:12px; padding-top:10px; border-top:2px dashed rgba(17,17,17,.28); display:grid; gap:6px; }
    .compact-switch{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:32px; }
    .compact-switch small{ display:none; }
    .compact-switch b{ display:block; color:var(--black); font-size:13px; font-weight:900; }
    #settingsSection{ display:none!important; }
    .settings-panel{ display:grid; gap:14px; }
    .settings-lede{ border:2px solid #111; background:rgba(255,255,255,.86); box-shadow:3px 3px 0 rgba(17,17,17,.16); padding:13px 14px; }
    .settings-lede span{ display:inline-flex; padding:2px 8px; border-radius:999px; background:#111; color:#fff; font-family:var(--fontd); font-size:9px; font-weight:900; letter-spacing:.14em; }
    .settings-lede b{ display:block; margin-top:8px; font-family:var(--fontcute); font-size:18px; line-height:1; }
    .settings-lede p{ margin:7px 0 0; color:#555; font-size:12px; font-weight:750; line-height:1.6; }
    .config-card{ border:0; border-radius:0 18px 18px 0; background:linear-gradient(180deg,rgba(255,255,255,.76),rgba(241,241,241,.44)),linear-gradient(180deg,rgba(17,17,17,.16) 0%,rgba(17,17,17,.90) 24%,rgba(17,17,17,.90) 76%,rgba(17,17,17,.16) 100%); background-repeat:no-repeat; background-size:100% 100%,3px 100%; padding:13px 13px 13px 18px; box-shadow:0 13px 30px rgba(0,0,0,.07); }
    .config-card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:11px; padding-bottom:10px; border-bottom:1.5px dashed rgba(17,17,17,.22); }
    .config-card-title{ font-family:var(--fontcute); font-size:17px; font-weight:900; color:#050505; }
    .config-card-note{ margin-top:5px; font-size:11px; font-weight:750; color:#5f5f5f; line-height:1.58; }
    .config-badge{ flex:0 0 auto; border:1.5px solid #111; border-radius:999px; padding:3px 9px; background:#fff; font-family:var(--fontd); font-size:10px; font-weight:900; color:#666; box-shadow:1px 1px 0 rgba(17,17,17,.18); }
    .config-badge.ready{ background:#111; color:#fff; }
    .field-grid{ display:grid; gap:10px; }
    .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .api-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .tiny-action{ min-height:34px; border-radius:999px; border:2px solid #111; background:#fff; color:#111; font-family:var(--fontd); font-size:12px; font-weight:900; box-shadow:2px 2px 0 rgba(17,17,17,.18); }
    .tiny-action.primary{ background:#111; color:#fff; }
    .tiny-action:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(17,17,17,.22); }
    .model-choice-list{ display:flex; flex-wrap:wrap; gap:7px; min-height:0; }
    .model-choice{ border:1.5px solid #111; border-radius:999px; background:#fff; color:#111; padding:7px 10px; font-size:11px; font-family:var(--fontd); font-weight:900; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .model-choice:active{ transform:translate(1px,1px); }
    .save-all{ width:100%; margin-top:2px; }
    .settings-overlay{
      position:fixed;
      inset:0;
      z-index:520;
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);
      background:rgba(255,255,255,.28);
      backdrop-filter:blur(12px) saturate(120%);
      -webkit-backdrop-filter:blur(12px) saturate(120%);
    }
    .settings-overlay.open{ display:flex; }
    .settings-sheet{
      width:min(720px,100%);
      max-height:min(82vh,760px);
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      border:2px solid #111;
      border-radius:0 24px 24px 0;
      background:rgba(255,255,255,.90);
      box-shadow:8px 8px 0 rgba(17,17,17,.16),0 24px 58px rgba(0,0,0,.18);
      padding:14px;
    }
    .settings-sheet-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding-bottom:11px;
      margin-bottom:13px;
      border-bottom:3px double #111;
    }
    .settings-sheet-title{ font-family:var(--fontcute); font-size:20px; font-weight:900; color:#111; }
    .settings-sheet-sub{ margin-top:3px; font-size:10px; font-family:var(--fontd); font-weight:900; letter-spacing:.12em; color:#666; text-transform:uppercase; }
    .settings-close{ width:34px; height:34px; border:2px solid #111; border-radius:999px; background:#111; color:#fff; font-family:var(--fontd); font-size:18px; font-weight:900; line-height:1; display:grid; place-items:center; box-shadow:2px 2px 0 rgba(17,17,17,.18); }
    .settings-close:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(17,17,17,.22); }
    @media (min-width:720px){
      .content{ max-width:720px; width:100%; margin:0 auto; }
      .topbar{ left:calc(50% - 360px); right:auto; width:720px; }
      .memory-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
      .char-card-list{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:390px){
      .field-row{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" type="button" id="backBtn" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="topbar-spacer" aria-hidden="true"></div>
      <p id="subtitle">读取角色记忆中</p>
      <button class="icon-btn" type="button" id="settingsBtn" aria-label="设置">
        <img src="assets/聊天设置.png" alt="" aria-hidden="true">
      </button>
    </header>
    <main class="content">
      <div class="char-strip" id="charStrip"></div>
      <section class="panel hero" id="heroPanel"></section>

          body:JSON.stringify({ model:model, messages:[{ role:'user', content:'Hi' }], max_tokens:5, stream:false })
        });
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        toast('副 API 可用');
      }catch(err){
        toast('副 API 测试失败：' + String(err && err.message || err));
      }
    }
    async function testEmbeddingConnection(){
      var baseUrl = String(($('embBaseUrl') || {}).value || '').trim().replace(/\/+$/,'');
      var apiKey = String(($('embApiKey') || {}).value || '').trim();
      var model = String(($('embModel') || {}).value || '').trim() || 'BAAI/bge-m3';
      if(!baseUrl || !apiKey || !model){ toast('先填完整向量 API'); return; }
      toast('向量 API 测试中...');
      try{
        var body = { model:model, input:'测试文本' };
        var dim = Math.max(0, Number(($('embDimensions') || {}).value || 0) || 0);
        if(dim) body.dimensions = dim;
        var resp = await fetch(baseUrl + '/embeddings', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + apiKey },
          body:JSON.stringify(body)
        });
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        var data = await resp.json().catch(function(){ return null; });
        var vec = data && data.data && data.data[0] && data.data[0].embedding;
        toast(Array.isArray(vec) ? ('向量 API 可用：' + vec.length + ' 维') : '向量 API 已响应');
      }catch(err){
        toast('向量 API 测试失败：' + String(err && err.message || err));
      }
    }
    async function testRerankConnection(){
      var baseUrl = String(($('rerankBaseUrl') || {}).value || '').trim().replace(/\/+$/,'');
      var apiKey = String(($('rerankApiKey') || {}).value || '').trim();
      var model = String(($('rerankModel') || {}).value || '').trim() || 'BAAI/bge-reranker-v2-m3';
      if(!baseUrl || !apiKey || !model){ toast('先填完整 rerank API'); return; }
      toast('rerank 测试中...');
      try{
        var resp = await fetch(baseUrl + '/rerank', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + apiKey },
          body:JSON.stringify({ model:model, query:'今天想见谁', documents:['他今天在学校','今天下雨','她喜欢喝冰美式'], top_n:2 })
        });
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        toast('rerank API 可用');
      }catch(err){
        toast('rerank 测试失败：' + String(err && err.message || err));
      }
    }
    function openSettings(){
      renderSettings();
      var overlay = $('settingsOverlay');
      if(!overlay) return;
      overlay.hidden = false;
      overlay.classList.add('open');
    }
    function closeSettings(){
      var overlay = $('settingsOverlay');
      if(!overlay) return;
      overlay.classList.remove('open');
      overlay.hidden = true;
    }
    function renderSettings(){
      state.config = normalizeConfig(state.config || getConfig());
      var light = state.config.lightLLM || {};
      var emb = state.config.embedding || {};
      var rerank = state.config.rerank || {};
      var remote = state.config.remoteVector || {};
      var vectorOn = !(state.store && state.store.advancedMemory && state.store.advancedMemory.vector && state.store.advancedMemory.vector.settings && state.store.advancedMemory.vector.settings.enabled === false);
      if(state.view === 'picker') vectorOn = state.config.vectorEnabled !== false;
      $('settingsPanel').innerHTML = '<div class="settings-panel">'
        + '<section class="config-card"><div class="config-card-head"><div><div class="config-card-title">副 API</div><div class="config-card-note">用于后台总结和提取记忆。</div></div><span class="config-badge ' + (hasLightApi() ? 'ready' : '') + '">' + (hasLightApi() ? '已配置' : '待配置') + '</span></div>'
        + '<div class="field-grid"><div class="field"><label>BASE URL</label><input id="lightBaseUrl" value="' + esc(light.baseUrl || '') + '" placeholder="https://api.../v1"></div><div class="field"><label>API KEY</label><input id="lightApiKey" type="password" value="' + esc(light.apiKey || '') + '" placeholder="sk-..."></div><div class="field"><label>MODEL</label><input id="lightModel" value="' + esc(light.model || '') + '" placeholder="deepseek / qwen / glm flash"></div><div class="api-actions"><button class="tiny-action primary" id="pullLightModelsBtn" type="button">拉取模型</button><button class="tiny-action" id="testLightBtn" type="button">测试副 API</button></div><div class="model-choice-list" id="lightModelChoices"></div></div></section>'
        + '<section class="config-card"><div class="config-card-head"><div><div class="config-card-title">Embedding API</div><div class="config-card-note">用于向量检索。</div></div><span class="config-badge ' + (hasEmbeddingApi() ? 'ready' : '') + '">' + (hasEmbeddingApi() ? '已配置' : '待配置') + '</span></div>'
        + '<div class="field-grid"><div class="field"><label>BASE URL</label><input id="embBaseUrl" value="' + esc(emb.baseUrl || '') + '" placeholder="https://api.siliconflow.cn/v1"></div><div class="field"><label>API KEY</label><input id="embApiKey" type="password" value="' + esc(emb.apiKey || '') + '" placeholder="sk-..."></div><div class="field-row"><div class="field"><label>EMBEDDING MODEL</label><input id="embModel" value="' + esc(emb.model || 'BAAI/bge-m3') + '" placeholder="BAAI/bge-m3"></div><div class="field"><label>DIMENSIONS</label><input id="embDimensions" type="number" min="1" value="' + esc(emb.dimensions || 1024) + '"></div></div><div class="api-actions"><button class="tiny-action primary" id="pullEmbeddingModelsBtn" type="button">拉取模型</button><button class="tiny-action" id="testEmbeddingBtn" type="button">测试向量 API</button></div><div class="model-choice-list" id="embModelChoices"></div></div></section>'
        + '<section class="config-card"><div class="config-card-head"><div><div class="config-card-title">Rerank API</div><div class="config-card-note">用于检索排序，可选。</div></div><span class="config-badge ' + (rerank.enabled && rerank.baseUrl && rerank.apiKey ? 'ready' : '') + '">' + (rerank.enabled ? '已开启' : '可选') + '</span></div>'
        + '<div class="switch-line"><span>启用 rerank 通道</span><button class="switch ' + (rerank.enabled ? 'on' : '') + '" id="rerankSwitch" type="button" aria-label="启用 rerank"></button></div><button class="tiny-action" id="copyEmbToRerankBtn" type="button">从 Embedding 复制 URL 和 Key</button>'
        + '<div class="field-grid"><div class="field"><label>RERANK BASE URL</label><input id="rerankBaseUrl" value="' + esc(rerank.baseUrl || '') + '" placeholder="https://.../v1"></div><div class="field"><label>RERANK API KEY</label><input id="rerankApiKey" type="password" value="' + esc(rerank.apiKey || '') + '" placeholder="sk-..."></div><div class="field-row"><div class="field"><label>RERANK MODEL</label><input id="rerankModel" value="' + esc(rerank.model || 'BAAI/bge-reranker-v2-m3') + '" placeholder="BAAI/bge-reranker-v2-m3"></div><div class="field"><label>TOP N</label><input id="rerankTopN" type="number" min="1" max="20" value="' + esc(rerank.topN || 5) + '"></div></div><div class="api-actions"><button class="tiny-action primary" id="pullRerankModelsBtn" type="button">拉取模型</button><button class="tiny-action" id="testRerankBtn" type="button">测试 rerank</button></div><div class="model-choice-list" id="rerankModelChoices"></div></div></section>'
        + '<section class="config-card"><div class="config-card-head"><div><div class="config-card-title">开关</div><div class="config-card-note">控制检索和远程存储。</div></div></div><div class="switch-line"><span>向量检索</span><button class="switch ' + (vectorOn ? 'on' : '') + '" id="vectorSwitch" type="button" aria-label="向量检索"></button></div><div class="switch-line"><span>远程向量存储</span><button class="switch ' + (remote.enabled ? 'on' : '') + '" id="remoteVectorSwitch" type="button" aria-label="远程向量存储"></button></div><div class="field-grid"><div class="field"><label>SUPABASE URL</label><input id="remoteVectorUrl" value="' + esc(remote.supabaseUrl || '') + '" placeholder="https://...supabase.co"></div><div class="field"><label>SUPABASE ANON KEY</label><input id="remoteVectorKey" type="password" value="' + esc(remote.supabaseAnonKey || '') + '" placeholder="ey..."></div></div></section>'
        + '<button class="action save-all" id="saveSettingsBtn" type="button">保存全部 API 配置</button>'
        + '</div>';
      $('vectorSwitch').onclick = function(){
        state.config.vectorEnabled = !vectorOn;
        if(state.store && state.store.advancedMemory && state.store.advancedMemory.vector){
          state.store.advancedMemory.vector.settings.enabled = !vectorOn;
          saveMemory().then(function(){ render(); toast('已保存'); });
        }else{
          saveConfig();
          renderSettings();
          toast('已保存');
        }
      };
      $('rerankSwitch').onclick = function(){
        state.config.rerank = Object.assign({}, state.config.rerank || {}, { enabled: !rerank.enabled });
        saveConfig();
        renderSettings();
      };
      $('remoteVectorSwitch').onclick = function(){
        state.config.remoteVector = Object.assign({}, state.config.remoteVector || {}, { enabled: !remote.enabled });
        saveConfig();
        renderSettings();
      };
      $('copyEmbToRerankBtn').onclick = function(){
        $('rerankBaseUrl').value = $('embBaseUrl').value.trim();
        $('rerankApiKey').value = $('embApiKey').value.trim();
        toast('已复制');
      };
      $('pullLightModelsBtn').onclick = function(){ pullModels('light'); };
      $('pullEmbeddingModelsBtn').onclick = function(){ pullModels('embedding'); };
      $('pullRerankModelsBtn').onclick = function(){ pullModels('rerank'); };
      $('saveSettingsBtn').onclick = function(){
        var nextCfg = normalizeConfig(state.config || {});
        nextCfg.lightLLM = {
          baseUrl:$('lightBaseUrl').value.trim(),
          apiKey:$('lightApiKey').value.trim(),
          model:$('lightModel').value.trim()
        };
        nextCfg.embedding = {
          baseUrl:$('embBaseUrl').value.trim(),
          apiKey:$('embApiKey').value.trim(),
          model:$('embModel').value.trim() || 'BAAI/bge-m3',
          dimensions:Math.max(1, Number($('embDimensions').value || 1024) || 1024)
        };
        state.config.rerank = {
          enabled: $('rerankSwitch').classList.contains('on'),
          baseUrl: $('rerankBaseUrl').value.trim(),
          apiKey: $('rerankApiKey').value.trim(),
          model: $('rerankModel').value.trim() || 'BAAI/bge-reranker-v2-m3',
          topN: Math.max(1, Math.min(20, Number($('rerankTopN').value || 5) || 5))
        };
        nextCfg.rerank = state.config.rerank;
        nextCfg.remoteVector = {
          enabled:$('remoteVectorSwitch').classList.contains('on'),
          supabaseUrl:$('remoteVectorUrl').value.trim(),
          supabaseAnonKey:$('remoteVectorKey').value.trim()
        };
        nextCfg.vectorEnabled = $('vectorSwitch').classList.contains('on');
        state.config = nextCfg;
        saveConfig();
        renderSettings();
        toast('小脑瓜配置已保存');
      };
      $('testLightBtn').onclick = testLightApiConnection;
      $('testEmbeddingBtn').onclick = testEmbeddingConnection;
      $('testRerankBtn').onclick = testRerankConnection;
    }
    function render(){
      if(state.view === 'picker'){
        renderPicker();
      }else{
        setSectionVisibility('detail');
        renderChars();
        renderHero();
        renderMemoryLists();
      }
      renderSettings();
      hydrateAvatarNodes();
    }
    async function selectCharacter(id, options){
      var opts = options && typeof options === 'object' ? options : {};
      var next = state.chars.find(function(c){ return String(c.id) === String(id); }) || state.chars[0] || null;
      state.char = next;
      state.store = next ? await loadMemory(next.id) : normalizeStore(null);
      if(!opts.keepView) state.view = 'detail';
      render();
    }
    async function toggleCharacterBrain(id, on){
      await patchCharacter(id, {
        littleBrainEnabled:!!on,
        memoryPalaceEnabled:!!on,
        memoryMode:'structured'
      });
      if(state.char && String(state.char.id) === String(id) && state.store){
        state.store.advancedMemory.mode = 'structured';
        state.store.advancedMemory.vector.settings.enabled = on ? true : state.store.advancedMemory.vector.settings.enabled;
        await saveMemory();
      }
      render();
      toast(on ? '小脑瓜已启用' : '小脑瓜已关闭');
    }
    async function toggleCharacterAutoMemory(id, on){
      if(on && !hasLightApi()){
        toast('请先配置副 API');
        return;
      }
      if(on && !hasEmbeddingApi()){
        toast('请先配置 Embedding API');
        return;
      }
      var target = state.chars.find(function(c){ return String(c.id) === String(id); });
      if(on && !isCharacterBrainEnabled(target)){
        await toggleCharacterBrain(id, true);
      }
      await patchCharacter(id, {
        littleBrainAutoMemoryEnabled:!!on,
        autoArchiveEnabled:!!on,
        memoryPalaceEnabled:on ? true : (target ? !!target.memoryPalaceEnabled : false),
        littleBrainEnabled:on ? true : (target ? !!target.littleBrainEnabled : false),
        memoryMode:on ? 'structured' : (target && target.memoryMode || 'structured')
      });
      render();
      toast(on ? '全自动记忆已开启' : '全自动记忆已关闭');
    }
    function foldStoredItemsIntoShortTerm(){
      if(!state.store) return 0;
      var mem = state.store.advancedMemory.structured;
      var list = Array.isArray(mem.shortTerm) ? mem.shortTerm : [];
      var added = 0;
      (Array.isArray(state.store.items) ? state.store.items : []).forEach(function(item){
        var text = String(item && item.text || '').trim();
        if(!text || list.some(function(row){ return String(row && row.text || '').trim() === text; })) return;
        list.push({
          id:'st_existing_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7),
          text:text,
          label:String(item && item.label || '历史整理'),
          memoryCategory:String(item && item.memoryCategory || 'E'),
          sourceType:String(item && item.sourceType || 'existing_summary'),
          createdAt:Number(item && item.createdAt || Date.now()) || Date.now(),
          updatedAt:Date.now()
        });
        added += 1;
      });
      mem.shortTerm = list;
      mem.lastUpdated = Date.now();
      state.store.items = [];
      return added;
    }
    async function enableLittleBrain(){
      if(!state.store) return;
      toast('正在重整记忆...');
      state.store.advancedMemory.mode = 'structured';
      state.store.advancedMemory.vector.settings.enabled = true;
      var material = '';
      var generated = 0;
      var folded = 0;
      try{
        var chatHistory = await readChatHistoryForCharacter(state.char && state.char.id);
        var offlineSession = await readOfflineSessionForCharacter(state.char && state.char.id);
        material = buildLittleBrainResummaryMaterial(chatHistory, offlineSession, state.store);
        if(material && hasLightApi()){
          var snapshot = await callLightApiForStructuredMemory(material);
          generated = mergeGeneratedStructuredMemory(snapshot);
        }
      }catch(err){
        toast('副 API 重整失败，先整理现有摘要');
      }
      folded = foldStoredItemsIntoShortTerm();
      var vectorAdded = addVectorRowsFromKnownMemory();
      await saveMemory();
      if(state.char && state.char.id){
        await patchCharacter(state.char.id, {
          littleBrainEnabled:true,
          memoryPalaceEnabled:true,
          memoryMode:'structured'
        });
      }
      render();
      toast('已重整 ' + (generated + folded) + ' 条记忆，补入 ' + vectorAdded + ' 条检索');
    }
    function vectorDup(list, text){
      var src = String(text || '').trim();
      if(!src) return true;
      return list.some(function(item){ return String(item.content || '').trim() === src; });
    }
    function addVectorRowsFromKnownMemory(){
      if(!state.store) return;
      var vector = state.store.advancedMemory.vector;
      vector.fragments = Array.isArray(vector.fragments) ? vector.fragments : [];
      var rows = structuredItems(state.store);
      var added = 0;
      rows.forEach(function(row){
        var text = String(row.text || '').trim();
        if(!text || vectorDup(vector.fragments, text)) return;
        vector.fragments.push({
          id:'brain_vec_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7),
          content:text,
          tags:String(row.label || '').split(/[，,\s]+/).filter(Boolean).slice(0,6),
          category:'E',
          importance:5,
          emotionalWeight:3,
          createdAt:Date.now(),
          lastRecalled:0,
          recallCount:0,
          embedding:null,
          linkedMemories:[],
          source:'little_brain_rebuild',
          sourceType:String(row.sourceType || 'little_brain_rebuild'),
          context:String(row.label || '')
        });
        added += 1;
      });
      vector.lastExtractionAt = Date.now();
      return added;
    }
    async function rebuildVectorFromKnownMemory(){
      if(!state.store) return;
      var added = addVectorRowsFromKnownMemory();
      await saveMemory();
      render();
      toast('已补入 ' + added + ' 条检索片段');
    }
    async function promoteShortTerm(){
      if(!state.store) return;
      var mem = state.store.advancedMemory.structured;
      var list = Array.isArray(mem.shortTerm) ? mem.shortTerm.slice() : [];
      if(!list.length){ toast('没有短期记忆要归集'); return; }
      mem.custom = mem.custom && typeof mem.custom === 'object' ? mem.custom : {};
      list.forEach(function(item){
        var category = String(item.memoryCategory || '').replace(/^custom:/,'') || 'E';
        var text = String(item.text || '').trim();
        if(!text) return;
        if(category === 'relationship'){
          mem.emotions = Array.isArray(mem.emotions) ? mem.emotions : [];
          mem.emotions.push(text);
        }else if(category === 'plans'){
          mem.plans = Array.isArray(mem.plans) ? mem.plans : [];
          mem.plans.push(text);
        }else if(category === 'decisions'){
          mem.decisions = Array.isArray(mem.decisions) ? mem.decisions : [];
          mem.decisions.push(text);
        }else{
          var code = /^[AHX]$/.test(category) ? category : 'E';
          mem.custom[code] = Array.isArray(mem.custom[code]) ? mem.custom[code] : [];
          mem.custom[code].push(text);
        }
      });
      mem.shortTerm = [];
      mem.lastUpdated = Date.now();
      await saveMemory();
      render();
      toast('短期记忆已归集');
    }
    async function init(){
      $('backBtn').onclick = function(){
        if(state.view !== 'picker'){
          state.view = 'picker';
          render();
          return;
        }
        try{ window.parent.postMessage({ type:'CLOSE_APP' }, '*'); }catch(err){}
      };
      $('settingsBtn').onclick = openSettings;
      $('closeSettingsBtn').onclick = closeSettings;
      $('settingsOverlay').addEventListener('click', function(event){
        if(event.target === $('settingsOverlay')) closeSettings();
      });
      state.config = getConfig();
      state.chars = await loadCharacters();
      state.view = 'picker';
      await selectCharacter(activeCharacterId(state.chars), { keepView:true });
      if(!state.chars.length){
        $('subtitle').textContent = '还没有角色';
      }
    }
    window.addEventListener('message', function(event){
      var data = event && event.data || {};
      if(data.type === 'SHELL_METADATA_DIRTY'){
        init().catch(function(){});
      }
    });
    init().catch(function(err){
      $('subtitle').textContent = '小脑瓜读取失败';
      toast(String(err && err.message || err || '读取失败'));
    });
    window.__LITTLE_BRAIN_BUILD_ID__ = BUILD_ID;
  })();
  </script>
</body>
